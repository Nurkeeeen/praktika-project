# Команда, календарь и внешние зависимости (ЗС 5). Даты — 2026/2027 учебный год.
# Неделя курса k начинается в понедельник: 07.09.2026 + 7·(k−1); неделя 15 — 14–20.12.2026.

team:
  - {id: PM, name: Бекмағанбет Әлібек, role: "PM, коммуникация с заказчиком, бэкенд"}
  - {id: BA, name: Зият Нүркен, role: "Аналитика и требования, QA, CI/CD, документация"}

capacity:
  hours_per_week: 10      # [C1] часов в неделю на проект на человека: лекция и лабораторная + самостоятельная работа по курсу
  focus_factor: 0.7       # [C2] доля часов на задачи: остальное — встречи, переключения, ревью
  reserve: 0.10           # [C3] резерв на болезни и непредвиденное
  planning_start_week: 6  # считаем с 12.10.2026
  last_week: 15
  week_factors:           # доля обычной недели [C4]
    8: 0.48   # рубежный контроль 1 (×0,6) и выходной 26.10 за День Республики (×0,8)
    14: 0.6   # рубежный контроль 2
    15: 0.4   # защита проекта, начало сессии (×0,5) и 16.12 День Независимости (×0,8)
  winter:                 # [C5] сессия до середины января — проектом не занимаемся; каникулы — по желанию команды
    weeks: 2
    hours_per_week: 8
    label: "каникулы 18–31.01.2027"

milestones:
  - {id: M1, name: "Демо ходячего скелета методисту", week: 8, date: "2026-10-30"}
  - {id: M2, name: "MVP на стенде, UAT с методистом", week: 11, date: "2026-11-20"}
  - {id: M3, name: "Защита проекта (сдача курса)", week: 15, date: "2026-12-18"}
  - {id: M4, name: "Запуск пилота", week: null, date: "2027-02-01"}

increments:
  - id: 1
    name: Ходячий скелет
    weeks: [6, 8]
    milestone: M1
    goal: Методист проходит сквозной сценарий «вакансия → заявка студента → очередь методиста → статус у студента» на стенде.
    stories: [S01, S02, S04, S05, S07, S08]
    done: ["Сценарий S01→S04→S07→S05 проходит на стенде без подсказок команды", "Все тесты и CI зелёные", "Методист письменно подтвердил демо или дал замечания (протокол)", "Макеты экранов согласованы"]
  - id: 2
    name: MVP для пилота
    weeks: [9, 11]
    milestone: M2
    goal: Система готова к реальным пользователям — вход, роли, согласие на ПДн, уведомления, кабинет куратора.
    stories: [S10, S11, S15, S16, S19]
    done: ["Протокол UAT подписан методистом", "NFR-01, 05, 06, 08, 10 проверены", "Модель угроз и чек-лист соответствия пройдены (ЗС 7)", "Пайплайн CI/CD разворачивает стенд автоматически"]
  - id: 3
    name: Готовность к запуску
    weeks: [12, 15]
    milestone: M3
    goal: Данные перенесены, ИТ-отдел умеет разворачивать и поддерживать систему, пользователи обучены.
    stories: [S14, S18]
    done: ["Акт сверки перенесённых данных подписан (NFR-16)", "Сотрудник ИТ-отдела развернул систему по runbook ≤ 30 мин (NFR-17)", "Обучение проведено, инструкции переданы", "Go / no-go запуска подписан спонсором"]

dependencies:
  # type: решение заказчика | внешняя служба | поставщик | интеграция
  - {id: D1, party: ИТ-отдел, type: внешняя служба, what: "Согласие на поддержку ≤ 4 ч/мес и размещение (go / no-go №2)", needed_for: "1.6.3", owner: PM, confirm_by: "2026-10-16", blocks: M4}
  - {id: D2, party: Методист, type: решение заказчика, what: "Замер времени на сведение заявок за 2 недели (go / no-go №1, допущение A3)", needed_for: "1.1.2", owner: PM, confirm_by: "2026-10-14", blocks: M1}
  - {id: D3, party: Методист, type: решение заказчика, what: "Время для демо на неделе 8 и UAT на неделе 11", needed_for: "1.1.4", owner: PM, confirm_by: "2026-10-14", blocks: M1}
  - {id: D4, party: Методист, type: решение заказчика, what: "Образец текущей Excel-таблицы заявок", needed_for: "1.3.3", owner: BA, confirm_by: "2026-10-21", blocks: M3}
  - {id: D5, party: Юрист по ПДн, type: внешняя служба, what: "Текст согласия и срок хранения данных (NFR-10, NFR-11)", needed_for: "1.5.2", owner: BA, confirm_by: "2026-10-23", blocks: M2}
  - {id: D6, party: Учебный отдел, type: внешняя служба, what: "Формат выгрузки для приказа о практике (S18)", needed_for: "1.3.3", owner: BA, confirm_by: "2026-10-23", blocks: M3}
  - {id: D7, party: Спонсор, type: решение заказчика, what: "Утверждение бюджета эксплуатации из бизнес-кейса", needed_for: "1.6.3", owner: PM, confirm_by: "2026-10-30", blocks: M4}
  - {id: D8, party: ИТ-отдел, type: интеграция, what: "Почтовый ящик / SMTP для уведомлений", needed_for: "1.5.3", owner: PM, confirm_by: "2026-11-06", blocks: M2}
  - {id: D9, party: ИТ-отдел, type: интеграция, what: "Вход через почту вуза или SSO (спайк S19)", needed_for: "1.5.1", owner: PM, confirm_by: "2026-11-06", blocks: M2}
  - {id: D10, party: hoster.kz, type: поставщик, what: "VPS Cloud 1-2-50 и сервер резервных копий в РК", needed_for: "1.6.3", owner: BA, confirm_by: "2026-11-20", blocks: M3}
  - {id: D11, party: Служба ИБ, type: внешняя служба, what: "Разрешение на публикацию в интернет после модели угроз", needed_for: "1.6.3", owner: BA, confirm_by: "2026-12-04", blocks: M3}
  - {id: D12, party: Работодатели, type: внешняя служба, what: "Контакты HR и согласие получать пакеты заявок", needed_for: "1.7.3", owner: PM, confirm_by: "2027-01-15", blocks: M4}
