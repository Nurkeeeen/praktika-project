# WBS проекта «Практика» (ЗС 5). Ориентирована на результаты (deliverables), правило 100 %:
# всё, что команда делает в проекте, лежит в одном из пакетов уровня 3, и ничего лишнего.
# hours — оставшаяся трудоёмкость с 12.10.2026 (сделанное = 0), оценка команды в часах (допущение, уточняется
# покером планирования в ЗС 6). inc — инкремент плана релизов: 1, 2, 3 или ongoing (идёт весь семестр).
# owner: PM — Бекмағанбет Әлібек, BA — Зият Нұркен.

project: "1 Система «Практика»"
items:
  - id: "1.1"
    name: Управление проектом
    children:
      - {id: "1.1.1", name: "Инициация: бизнес-кейс, устав, ADR", hours: 0, status: done, inc: done, owner: PM}
      - {id: "1.1.2", name: "Планирование: WBS, релизы, оценка, риски, бюджет (ЗС 5–8)", hours: 26, status: in_progress, inc: ongoing, owner: PM}
      - {id: "1.1.3", name: "Мониторинг: спринты, метрики потока, статус-отчёты (ЗС 9, 14)", hours: 14, status: todo, inc: ongoing, owner: PM}
      - {id: "1.1.4", name: "Коммуникации: демо, согласования со стейкхолдерами", hours: 12, status: in_progress, inc: ongoing, owner: PM}
  - id: "1.2"
    name: Требования и дизайн
    children:
      - {id: "1.2.1", name: "Discovery: интервью, story map", hours: 6, status: in_progress, inc: 1, owner: BA}
      - {id: "1.2.2", name: "Бэклог и НФТ: уточнение, Change Request", hours: 4, status: in_progress, inc: ongoing, owner: BA}
      - {id: "1.2.3", name: "Макеты экранов студента и методиста", hours: 10, status: todo, inc: 1, owner: BA}
  - id: "1.3"
    name: Платформа и данные
    children:
      - {id: "1.3.1", name: "Модель данных и переход на PostgreSQL", hours: 10, status: todo, inc: 2, owner: PM}
      - {id: "1.3.2", name: "API заявок и статусов", hours: 4, status: in_progress, inc: 1, owner: PM, stories: [S04, S05, S07]}
      - {id: "1.3.3", name: "Импорт и экспорт Excel", hours: 16, status: todo, inc: 3, owner: PM, stories: [S14, S18]}
  - id: "1.4"
    name: Пользовательские функции
    children:
      - {id: "1.4.1", name: "Кабинет студента: каталог, заявка, статус", hours: 20, status: todo, inc: 1, owner: PM, stories: [S01, S04, S05]}
      - {id: "1.4.2", name: "Рабочее место методиста: очередь, вакансии, передача работодателю", hours: 22, status: todo, inc: 1, owner: PM, stories: [S02, S07, S08]}
      - {id: "1.4.3", name: "Кабинет куратора: студенты и сроки отчётов", hours: 8, status: todo, inc: 2, owner: BA, stories: [S11]}
  - id: "1.5"
    name: Доступ и интеграции
    children:
      - {id: "1.5.1", name: "Вход через почту вуза или SSO (спайк + реализация)", hours: 12, status: todo, inc: 2, owner: PM, stories: [S19]}
      - {id: "1.5.2", name: "Роли, разграничение доступа, согласие на ПДн", hours: 14, status: todo, inc: 2, owner: PM, stories: [S15, S16]}
      - {id: "1.5.3", name: "Уведомления по почте", hours: 10, status: todo, inc: 2, owner: BA, stories: [S10]}
  - id: "1.6"
    name: Качество и выпуск
    children:
      - {id: "1.6.1", name: "CI/CD, окружения, DORA (ЗС 10)", hours: 10, status: in_progress, inc: 2, owner: BA}
      - {id: "1.6.2", name: "Тестирование и UAT (ЗС 11)", hours: 16, status: todo, inc: 2, owner: BA}
      - {id: "1.6.3", name: "Развёртывание на VPS, runbook, передача ИТ-отделу", hours: 10, status: todo, inc: 3, owner: BA}
