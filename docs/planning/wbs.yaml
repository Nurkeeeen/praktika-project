    name: Внедрение
    children:
      - {id: "1.7.1", name: "Перенос данных текущего семестра", hours: 6, status: todo, inc: 3, owner: BA}
      - {id: "1.7.2", name: "Обучение методистов и кураторов", hours: 6, status: todo, inc: 3, owner: BA}
      - {id: "1.7.3", name: "Запуск и поддержка первого месяца", hours: 10, status: todo, inc: 3, owner: PM}

# Словарь WBS — 5 ключевых пакетов работ
dictionary:
  "1.4.1":
    description: "Веб-интерфейс студента поверх готового API: каталог открытых мест с фильтрами, карточка вакансии, кнопка «Подать заявку», список «Мои заявки» со статусом."
    deliverables: "Страницы каталога, карточки и «Мои заявки»; автотесты сценария «нашёл → подал → увидел статус»."
    acceptance: "Критерии S01, S04, S05 выполнены на стенде; страница работает при ширине 360 px (NFR-14); p95 ≤ 800 мс (NFR-01)."
    depends_on: ["1.3.2 API", "1.2.3 макеты", "1.5.1 вход (до инкремента 2 — демо-вход)"]
    risks: "Нет опыта фронтенда в команде — берём простой серверный рендеринг (Jinja) вместо SPA."
  "1.4.2":
    description: "Рабочее место методиста: очередь новых заявок по сроку вакансии, форма вакансии, передача пакета заявок работодателю одним действием."
    deliverables: "Очередь заявок, форма вакансии, действие «Передать работодателю» с письмом HR."
    acceptance: "Критерии S02, S07, S08; методист проходит сценарий на демо недели 8 без подсказок команды."
    depends_on: ["1.3.2 API", "1.5.3 почта (для S08)", "решение методиста о тексте письма HR"]
    risks: "Методист доступен раз в 2–3 недели (риск №1 из ЛЗ 1) — демо назначаем заранее."
  "1.5.2":
    description: "Четыре роли (студент, методист, куратор, администратор), проверка прав на каждом эндпоинте, обязательное согласие на обработку ПДн с датой."
    deliverables: "Модель ролей, проверки доступа, экран согласия, тесты «чужая роль → 403»."
    acceptance: "S15, S16; NFR-06 (100 % эндпоинтов покрыты тестами доступа), NFR-10."
    depends_on: ["1.5.1 вход", "текст согласия от юриста по ПДн"]
    risks: "Юрист не успеет согласовать текст — используем типовой текст вуза и помечаем как временный."
  "1.3.3":
    description: "Импорт текущей Excel-таблицы карьерного центра с отчётом об ошибках и выгрузка списка принятых студентов для приказа."
    deliverables: "Импорт .xlsx с отчётом по строкам, экспорт .xlsx/.csv для учебного отдела."
    acceptance: "S14, S18, NFR-15 (1 000 строк ≤ 1 мин), NFR-16 (расхождение числа строк = 0)."
    depends_on: ["образец таблицы от методиста", "формат приказа от учебного отдела", "1.3.1 модель данных"]
    risks: "Таблица методиста «грязная» (объединённые ячейки, разные форматы дат) — закладываем час на ручную чистку."
  "1.6.3":
    description: "Развёртывание на VPS в Казахстане, резервное копирование, runbook для ИТ-отдела, передача поддержки."
    deliverables: "Рабочий стенд, ежесуточный бэкап, runbook, акт передачи ИТ-отделу."
    acceptance: "NFR-04 (тест восстановления), NFR-05 (HTTPS), NFR-17 (сотрудник ИТ-отдела разворачивает по runbook ≤ 30 мин без нашей помощи)."
    depends_on: ["согласие ИТ-отдела на поддержку (go / no-go №2)", "VPS hoster.kz", "1.6.1 CI/CD"]
    risks: "ИТ-отдел не берёт поддержку — по бизнес-кейсу ЛЗ 3 тогда не запускаемся."
