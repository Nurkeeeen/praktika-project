# Нефункциональные требования (ЗС 4). Правило курса: каждое требование проверяемо —
# есть метрика с порогом и способ проверки. auto: true — проверяется автотестом уже сейчас (tests/test_nfr.py).

- id: NFR-01
  category: Производительность
  requirement: Чтение списков и карточек (вакансии, заявки) отвечает быстро в пиковую неделю.
  metric: p95 времени ответа API ≤ 800 мс при 50 одновременных пользователях; smoke — p95 ≤ 200 мс на 200 последовательных запросов к демо-базе
  verify: k6 на стенде (ЗС 11); smoke — pytest в CI
  when: ЗС 10–11
  source: Методист (пик 30–40 заявок/нед), ADR-002
  auto: true

- id: NFR-02
  category: Масштабируемость
  requirement: Объём данных за 3 года эксплуатации не ухудшает NFR-01.
  metric: 3 000 студентов, 600 вакансий, 6 000 заявок в базе — NFR-01 выполняется
  verify: генерация объёма скриптом + повтор k6
  when: ЗС 11
  source: Бизнес-кейс ЛЗ 3 (горизонт 3 года)

- id: NFR-03
  category: Доступность (SLA)
  requirement: Сервис доступен в рабочее время университета.
  metric: ≥ 99,0 % в месяц с 08:00 до 20:00 по времени Астаны; плановые работы — только вне этого окна
  verify: внешний мониторинг (Uptime Kuma), отчёт за месяц
  when: с запуска
  source: Спонсор, ИТ-отдел

- id: NFR-04
  category: Резервное копирование
  requirement: Потеря данных и время восстановления ограничены.
  metric: RPO ≤ 24 ч (ежесуточная копия на отдельный сервер); RTO ≤ 4 ч; тест восстановления раз в квартал
  verify: протокол тестового восстановления на копии (runbook, ЗС 11)
  when: ЗС 11, далее ежеквартально
  source: ИТ-отдел, бизнес-кейс (VPS под резервные копии)

- id: NFR-05
  category: Безопасность передачи
  requirement: Весь трафик зашифрован.
  metric: только HTTPS, TLS 1.2+, HSTS; HTTP-запросы перенаправляются на HTTPS; оценка SSL Labs не ниже A
  verify: SSL Labs + curl -I на стенде
  when: ЗС 10
  source: Служба ИБ

- id: NFR-06
  category: Разграничение доступа
  requirement: Пользователь видит только данные своей роли.
  metric: 4 роли (студент, методист, куратор, администратор); 100 % эндпоинтов покрыты тестами «чужая роль → 403»
  verify: матрица «роль × эндпоинт» в pytest
  when: ЗС 9
  source: Ответственный за ПДн, S16

- id: NFR-07
  category: Аутентификация
  requirement: Система не становится местом утечки паролей.
  metric: вход через университетскую почту/SSO (спайк S19) либо пароли только в виде argon2-хэша; блокировка после 10 неудачных попыток за 15 минут
  verify: ревью кода + тест блокировки
  when: ЗС 9
  source: Служба ИБ

- id: NFR-08
  category: Аудит
  requirement: Любое изменение статуса заявки и данных студента прослеживается.
  metric: 100 % изменений статуса записаны в журнал (кто, когда, было, стало); журнал хранится ≥ 3 лет и не редактируется через интерфейс
  verify: pytest — каждое изменение статуса даёт запись истории
  when: уже есть в прототипе
  source: Методист (метрика «прослеживаемый статус»), бизнес-кейс
  auto: true

- id: NFR-09
  category: Журналирование
  requirement: Логи помогают разбирать инциденты и не содержат лишних персональных данных.
  metric: структурированные JSON-логи; e-mail и телефон маскируются; хранение 90 дней
  verify: проверка образца логов на стенде
  when: ЗС 10
  source: Служба ИБ, ответственный за ПДн

- id: NFR-10
  category: Персональные данные
  requirement: Обработка ПДн соответствует Закону РК «О персональных данных и их защите».
  metric: база с ПДн размещена на серверах в РК; 100 % профилей студентов созданы только после согласия с датой согласия
  verify: договор хостинга (hoster.kz, РК) + pytest «без согласия → 422»
  when: уже есть в прототипе (согласие); хостинг — ЗС 10
  source: Юрист / ответственный за ПДн
  auto: true

- id: NFR-11
  category: Сроки хранения ПДн
  requirement: Данные не хранятся дольше, чем нужно.
  metric: профили выпускников обезличиваются через 3 года после выпуска (срок согласовать с юристом); задача обезличивания запускается раз в месяц
  verify: тест задачи обезличивания на демо-данных
  when: релиз 2
  source: Юрист (допущение — подтвердить)

- id: NFR-12
  category: Локализация
  requirement: Интерфейс студента и методиста на казахском и русском.
  metric: 100 % строк интерфейса есть в обоих файлах переводов (kk, ru); английский — для писем работодателям
  verify: скрипт сравнения ключей переводов в CI
  when: релиз 2 (S20)
  source: Студенты, требования вуза к двуязычию

- id: NFR-13
  category: Доступность для людей с ограничениями (accessibility)
  requirement: Страницы студента пригодны для работы с клавиатуры и экранного диктора.
  metric: WCAG 2.1 уровень AA; Lighthouse Accessibility ≥ 90 на страницах студента
  verify: Lighthouse / axe в CI
  when: ЗС 11
  source: Требования вуза к инклюзивности

- id: NFR-14
  category: Совместимость
  requirement: Система работает в браузерах пользователей, включая телефон.
  metric: 2 последние версии Chrome, Firefox, Safari, Edge; ширина экрана от 360 px без горизонтальной прокрутки
  verify: ручной чек-лист на UAT (ЗС 11)
  when: ЗС 11
  source: Студенты (интервью)

- id: NFR-15
  category: Интеграции и форматы обмена
  requirement: Обмен данными с Excel без ручной перепечатки.
  metric: импорт .xlsx текущего формата центра — 1 000 строк ≤ 1 мин с отчётом об ошибках по номерам строк; экспорт для приказа — .xlsx и .csv UTF-8
  verify: pytest на эталонном файле
  when: MVP (S14, S18)
  source: Методист, учебный отдел

- id: NFR-16
  category: Миграция данных
  requirement: Данные текущего семестра переносятся полностью.
  metric: 100 % заявок текущего семестра в системе; расхождение числа строк с исходной таблицей = 0; акт сверки подписан методистом
  verify: скрипт сверки + акт
  when: январь 2027
  source: Методист, бизнес-кейс (статья «перенос данных»)

- id: NFR-17
  category: Эксплуатация
  requirement: Систему может поддерживать ИТ-отдел без команды.
  metric: развёртывание с нуля по runbook ≤ 30 мин одной командой; обновление без потери данных; средняя поддержка ≤ 4 ч/мес
  verify: развёртывание сотрудником ИТ-отдела по runbook без помощи команды
  when: ЗС 11, передача — февраль 2027
  source: ИТ-отдел, бизнес-кейс (допущение A10)

- id: NFR-18
  category: Уведомления
  requirement: Письма о смене статуса приходят быстро.
  metric: 99 % писем отправлены ≤ 5 мин после события; неудачная отправка повторяется до 3 раз и попадает в журнал
  verify: метрика очереди отправки на стенде
  when: MVP (S10)
  source: Студенты
