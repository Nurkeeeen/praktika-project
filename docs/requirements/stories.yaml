# Бэклог проекта «Практика» (ЗС 4). Единственный источник для story map, документа ЛЗ 4
# и задач на GitHub (scripts/create_issues.py). Базовая линия — тег baseline-v1 (см. change-management.md).
#
# release: skeleton — сквозной «ходячий скелет», mvp — релиз 1 (февраль 2027), r2 — релиз 2, later — потом
# activity: шаг пользовательского пути (столбец story map)
# api: что уже есть в прототипе (app/main.py), если есть

epics:
  E1: Каталог вакансий
  E2: Подача заявки
  E3: Маршрутизация и статусы
  E4: Практика и отчёты
  E5: Доступ, данные и соответствие
  E6: Аналитика

activities:
  A1: Найти место практики
  A2: Подать заявку
  A3: Обработать и направить заявку
  A4: Пройти отбор
  A5: Оформить практику
  A6: Сдать отчёт
  A7: Контролировать итоги

stories:
  - id: S01
    epic: E1
    activity: A1
    release: skeleton
    points: 3
    title: Список открытых мест практики с фильтрами
    story: Как студент, я хочу видеть открытые места практики с фильтром по городу и формату работы, чтобы выбрать подходящие, не листая переписку.
    acceptance:
      - Given есть открытые вакансии в Алматы и Астане, When студент выбирает фильтр «Астана», Then в списке только вакансии Астаны.
      - Given у вакансии прошёл срок приёма заявок, When студент открывает список, Then этой вакансии в списке нет.
    api: GET /vacancies

  - id: S02
    epic: E1
    activity: A1
    release: mvp
    points: 3
    title: Методист добавляет вакансию партнёра через форму
    story: Как методист, я хочу добавить вакансию партнёра через форму, чтобы не пересылать письма работодателей студентам вручную.
    acceptance:
      - Given методист заполнил обязательные поля, When нажимает «Опубликовать», Then вакансия видна студентам в течение минуты.
      - Given не указан срок приёма заявок, When методист сохраняет форму, Then система показывает ошибку и не публикует вакансию.
    api: POST /vacancies

  - id: S03
    epic: E1
    activity: A1
    release: r2
    points: 5
    title: Подбор вакансий по навыкам студента
    story: Как студент, я хочу видеть вакансии, подходящие под мои навыки, чтобы не перебирать весь список.
    acceptance:
      - Given у студента навыки Python и SQL, When он открывает «Подходящие», Then вакансии с требованиями Python и SQL стоят выше остальных.
      - Given совпадение навыков меньше 50 %, When студент открывает «Подходящие», Then такая вакансия не показывается.
    api: GET /students/{id}/matches

  - id: S04
    epic: E2
    activity: A2
    release: skeleton
    points: 5
    title: Подача заявки на вакансию
    story: Как студент, я хочу подать заявку на вакансию из карточки вакансии, чтобы не писать письмо методисту.
    acceptance:
      - Given вакансия открыта, When студент нажимает «Подать заявку», Then заявка создаётся со статусом «Подана» и появляется у методиста.
      - Given студент уже подал заявку на эту вакансию, When он пытается подать ещё раз, Then система сообщает, что заявка уже есть.
      - Given срок приёма заявок прошёл, When студент пытается подать заявку, Then кнопка недоступна.
    api: POST /applications

  - id: S05
    epic: E2
    activity: A2
    release: skeleton
    points: 3
    title: Студент видит статус своих заявок
    story: Как студент, я хочу видеть статус каждой своей заявки и дату последнего изменения, чтобы не спрашивать методиста.
    acceptance:
      - Given методист передал заявку работодателю, When студент открывает «Мои заявки», Then статус «Передана работодателю» и дата изменения.
      - Given у студента нет заявок, When он открывает «Мои заявки», Then видит подсказку, как подать первую.
    api: GET /applications/{id}

  - id: S06
    epic: E2
    activity: A2
    release: r2
    points: 2
    title: Отзыв заявки студентом
    story: Как студент, я хочу отозвать заявку, пока по ней не принято решение, чтобы освободить место другим.
    acceptance:
      - Given заявка в статусе «Подана» или «Передана», When студент нажимает «Отозвать», Then статус «Отозвана», методист видит это в очереди.
      - Given заявка в статусе «Принят(а)», When студент открывает заявку, Then кнопки «Отозвать» нет.
    api: PATCH /applications/{id}/status

  - id: S07
    epic: E3
    activity: A3
    release: skeleton
    points: 3
    title: Очередь новых заявок для методиста
    story: Как методист, я хочу видеть все новые заявки в одной очереди, отсортированной по сроку вакансии, чтобы ничего не терять.
    acceptance:
      - Given есть 10 новых заявок на разные вакансии, When методист открывает очередь, Then заявки отсортированы по сроку приёма вакансии, ближайший — сверху.
      - Given заявка обработана, When методист меняет её статус, Then она исчезает из очереди новых.

  - id: S08
    epic: E3
    activity: A3
    release: mvp
    points: 5
    title: Передача пакета заявок работодателю
    story: Как методист, я хочу передать работодателю все заявки по его вакансии одним действием, чтобы не собирать письма вручную.
    acceptance:
      - Given по вакансии 5 заявок в статусе «Подана», When методист нажимает «Передать работодателю», Then работодатель получает одно письмо со списком, все 5 заявок — в статусе «Передана».
      - Given у работодателя не указан e-mail, When методист пытается передать заявки, Then система просит заполнить контакт.

  - id: S09
    epic: E3
    activity: A4
    release: r2
    points: 8
    title: Работодатель отмечает итог отбора по ссылке
    story: Как HR работодателя, я хочу отметить итог отбора по ссылке из письма без регистрации, чтобы методист сразу узнал результат.
    acceptance:
      - Given работодатель открыл ссылку из письма, When отмечает кандидата «Принят», Then статус заявки меняется на «Принят(а)» с автором «employer».
      - Given ссылке больше 30 дней, When работодатель её открывает, Then видит сообщение, что ссылка устарела, и контакт методиста.

  - id: S10
    epic: E3
    activity: A4
    release: mvp
    points: 5
    title: Уведомление студента о смене статуса
    story: Как студент, я хочу получать письмо при смене статуса заявки, чтобы не проверять систему каждый день.
    acceptance:
      - Given статус заявки изменился, When прошло не более 5 минут, Then студент получил письмо с новым статусом и ссылкой на заявку.
      - Given письмо не доставлено, When сервер почты вернул ошибку, Then событие записано в журнал и повторяется до 3 раз.

  - id: S11
    epic: E4
    activity: A5
    release: mvp
    points: 3
    title: Куратор видит своих студентов и сроки отчётов
    story: Как куратор, я хочу видеть список своих студентов с местом практики и сроком отчёта, чтобы не собирать эти данные у методиста.
    acceptance:
      - Given у куратора 12 студентов, из них 7 приняты на практику, When куратор открывает «Мои студенты», Then видит 12 строк, у 7 — место и срок отчёта.
      - Given куратор открывает список, When у студента срок отчёта прошёл, Then строка выделена как просроченная.
    api: GET /reports/overdue

  - id: S12
    epic: E4
    activity: A6
    release: r2
    points: 5
    title: Напоминание о сроке отчёта
    story: Как куратор, я хочу, чтобы студенты без сданного отчёта получали напоминание за 7 дней до срока, чтобы меньше отчётов опаздывало.
    acceptance:
      - Given до срока отчёта 7 дней и отчёт не сдан, When срабатывает ежедневная задача, Then студент и куратор получают напоминание.
      - Given отчёт уже сдан, When срабатывает задача, Then напоминание не отправляется.

  - id: S13
    epic: E4
    activity: A6
    release: r2
    points: 5
    title: Загрузка отчёта о практике
    story: Как студент, я хочу загрузить отчёт о практике в систему, чтобы куратор видел факт и дату сдачи.
    acceptance:
      - Given студент принят на практику, When загружает PDF до 10 МБ, Then отчёт сохранён, дата сдачи видна куратору.
      - Given файл не PDF или больше 10 МБ, When студент загружает его, Then система отклоняет файл с понятным сообщением.

  - id: S14
    epic: E5
    activity: A3
    release: mvp
    points: 5
    title: Импорт текущей Excel-таблицы заявок
    story: Как методист, я хочу импортировать текущую Excel-таблицу заявок, чтобы не вводить семестр заново.
    acceptance:
      - Given таблица в текущем формате центра на 300 строк, When методист загружает её, Then все корректные строки импортированы, а по ошибочным выдан отчёт с номерами строк.
      - Given импорт выполнен, When методист сравнивает число строк, Then число заявок в системе равно числу корректных строк файла.

  - id: S15
    epic: E5
    activity: A2
    release: mvp
    points: 2
    title: Согласие на обработку персональных данных
    story: Как студент, я хочу дать согласие на обработку персональных данных при первом входе, чтобы понимать, какие данные и зачем хранятся.
    acceptance:
      - Given студент входит впервые, When не отмечает согласие, Then профиль не создаётся и заявку подать нельзя.
      - Given студент дал согласие, When методист открывает профиль, Then видна дата согласия.
    api: POST /students (consent_pd)

  - id: S16
    epic: E5
    activity: A7
    release: mvp
    points: 8
    title: Роли и разграничение доступа
    story: Как администратор ИТ-отдела, я хочу разграничить роли студент, методист, куратор и администратор, чтобы каждый видел только свои данные.
    acceptance:
      - Given пользователь с ролью «студент», When запрашивает заявку другого студента, Then получает отказ 403.
      - Given пользователь с ролью «куратор», When открывает список студентов, Then видит только студентов своей кафедры.

  - id: S17
    epic: E6
    activity: A7
    release: r2
    points: 3
    title: Ежемесячная сводка для спонсора
    story: Как руководитель карьерного центра, я хочу получать в начале месяца сводку по заявкам и отчётам, чтобы видеть эффект проекта без запросов команде.
    acceptance:
      - Given наступило 1-е число месяца, When срабатывает задача, Then спонсор получает письмо со статусами заявок, долей прослеживаемых заявок и числом просроченных отчётов.
    api: GET /stats

  - id: S18
    epic: E6
    activity: A5
    release: mvp
    points: 3
    title: Выгрузка распределения для приказа о практике
    story: Как методист, я хочу выгрузить список принятых на практику студентов в Excel, чтобы подготовить приказ в учебном отделе.
    acceptance:
      - Given 40 студентов приняты на практику, When методист нажимает «Выгрузить для приказа», Then скачивается .xlsx с 40 строками ФИО, группа, организация, сроки, куратор.

  - id: S19
    epic: E5
    activity: A2
    release: mvp
    points: 3
    type: spike
    title: "Spike: способ входа (университетская почта или SSO)"
    story: Как команда, мы хотим за 4 часа выяснить, можно ли входить через университетскую почту или SSO, чтобы не хранить пароли у себя.
    acceptance:
      - Given спайк завершён, When команда открывает ADR, Then в нём выбран способ входа, отклонённые варианты и согласие ИТ-отдела.

  - id: S20
    epic: E5
    activity: A1
    release: r2
    points: 5
    title: Интерфейс на казахском и русском
    story: Как студент, я хочу переключать интерфейс между казахским и русским, чтобы пользоваться системой на удобном языке.
    acceptance:
      - Given студент выбрал казахский, When открывает любую страницу студента, Then все подписи на казахском.
      - Given в файле переводов нет ключа на одном из языков, When запускается CI, Then проверка падает.
