name: Bug
description: Ошибка в работе системы
title: "[ЗС-N] "
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: "1.\n2.\n3."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидалось
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Фактически
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      options: [High, Medium, Low]
    validations:
      required: true
