name: ADR
description: Архитектурное или управленческое решение
title: "[ЗС-N] "
labels: ["type:adr"]
body:
  - type: textarea
    id: context
    attributes:
      label: Контекст
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Варианты
      placeholder: "1.\n2."
    validations:
      required: false
  - type: textarea
    id: decision
    attributes:
      label: Предлагаемое решение
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      options: [High, Medium, Low]
    validations:
      required: true
